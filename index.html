<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotesFlow - Focused Notes Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar glass">
      <a class="brand" href="#" aria-label="NotesFlow home">
        <span class="brand__mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand__text">
          <strong>NotesFlow</strong>
          <span>Think. Capture. Flow.</span>
        </span>
      </a>

      <div class="topbar__search" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input type="search" placeholder="Search notes" aria-label="Search notes" />
      </div>

      <nav class="topbar__nav" aria-label="Account actions">
        <button class="icon-btn" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10 21a2 2 0 0 0 4 0"></path>
          </svg>
          <span class="status-dot" aria-hidden="true"></span>
        </button>
        <button class="avatar" aria-label="Profile">AL</button>
      </nav>
    </header>

    <section class="workspace" aria-label="Notes dashboard">

      <section class="content-panel">
        <div class="hero-row">
          <div>
            <p class="eyebrow">Focused workspace</p>
            <h1>Your notes, shaped for quick review.</h1>
          </div>
          <button class="btn newNote btn--primary">
            <span class="fab__plus" aria-hidden="true">+</span>
            <span>Add Note</span>
          </button>
        </div>

        <div class="controls glass" aria-label="Note filters">
          <button class="segmented is-active">All</button>
          <button class="segmented">Pinned</button>
          <button class="segmented">Shared</button>
          <label class="select" for="priority">
            <span>Priority</span>
            <select id="priority">
              <option>All</option>
              <option>High Priority</option>
              <option>Medium Priority</option>
              <option>Low Priority</option>
            </select>
          </label>
          <div class="swipe">
            <button class="circle-btn" id="prevBtn" aria-label="Previous note" title="Previous note">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <button class="circle-btn" id="nextBtn" aria-label="Next note" title="Next note">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
        </div>

        <section class="stage" aria-label="Featured notes">
          <div class="stack">

          </div>
        </section>
      </section>
    </section>
  </main>

  <!-- Add Note Modal -->
  <div class="note-modal-background">
    <div class="note-modal glass">
      <div class="note-modal__header">
        <h2>Create New Note</h2>
        <button class="icon-btn cancelNote">×</button>
      </div>

      <form class="note-form">
        <div class="field" id="title">
          <label>Title</label>
          <input type="text" placeholder="Enter note title">
        </div>

        <div class="field" id="category">
          <label>Category</label>
          <input type="text" placeholder="Work, Personal, Ideas...">
        </div>

        <div class="field-row" id="priority">
          <div class="field">
            <label>Priority</label>
            <select>
              <option>High Priority</option>
              <option>Medium Priority</option>
              <option>Low Priority</option>
            </select>
          </div>

          <div class="field" id="date">
            <label>Date</label>
            <input type="date">
          </div>
        </div>

        <div class="field" id="note">
          <label>Content</label>
          <textarea placeholder="Write your note here..."></textarea>
        </div>

        <div class="note-form__actions">
          <button type="button" class="btn cancelNote btn--secondary">
            Cancel
          </button>

          <button type="submit" class="btn btn--primary" id="saveNote">
            Save Note
          </button>
        </div>
      </form>
    </div>
  </div>

  <aside class="toasts" aria-label="Recent activity">
    <div class="toast hideToast toast--success glass">
      <div class="toast__dot"></div>
      <div><strong>Note created</strong>
        <p>Saved to Inbox just now.</p>
      </div>
    </div>
    <div class="toast hideToast toast--warning glass">
      <div class="toast__dot"></div>
      <div><strong>High priority</strong>
        <p>Daily memo is marked urgent.</p>
      </div>
    </div>
  </aside>

  <div class="card-viewer-overlay">

    <button class="back-btn">
      ← Back
    </button>

    <div class="viewer-card glass">

      <!-- Clone card content here with JS -->

    </div>

    <div class="viewer-actions glass">

      <button class="action--edit action-btn">
        <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M416.9 85.2L372 130.1L509.9 268L554.8 223.1C568.4 209.6 576 191.2 576 172C576 152.8 568.4 134.4 554.8 120.9L519.1 85.2C505.6 71.6 487.2 64 468 64C448.8 64 430.4 71.6 416.9 85.2zM338.1 164L122.9 379.1C112.2 389.8 104.4 403.2 100.3 417.8L64.9 545.6C62.6 553.9 64.9 562.9 71.1 569C77.3 575.1 86.2 577.5 94.5 575.2L222.3 539.7C236.9 535.6 250.2 527.9 261 517.1L476 301.9L338.1 164z"/></svg>
        <span>Edit</span>
      </button>

      <button class="action--pin action-btn">
        <svg class="action-icon pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M160 96C160 78.3 174.3 64 192 64L448 64C465.7 64 480 78.3 480 96C480 113.7 465.7 128 448 128L418.5 128L428.8 262.1C465.9 283.3 494.6 318.5 507 361.8L510.8 375.2C513.6 384.9 511.6 395.2 505.6 403.3C499.6 411.4 490 416 480 416L160 416C150 416 140.5 411.3 134.5 403.3C128.5 395.3 126.5 384.9 129.3 375.2L133 361.8C145.4 318.5 174 283.3 211.2 262.1L221.5 128L192 128C174.3 128 160 113.7 160 96zM288 464L352 464L352 576C352 593.7 337.7 608 320 608C302.3 608 288 593.7 288 576L288 464z"/></svg>
        <svg class="action-icon unpin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L449.8 416L480 416C490 416 499.5 411.3 505.5 403.3C511.5 395.3 513.5 384.9 510.7 375.2L507 361.8C494.6 318.5 466 283.3 428.8 262.1L418.5 128L448 128C465.7 128 480 113.7 480 96C480 78.3 465.7 64 448 64L192 64C184.6 64 177.9 66.5 172.5 70.6L222.1 120.3L217.3 183.4L73 39.1zM314.2 416L181.7 283.6C159 304.1 141.9 331 133 361.9L129.2 375.3C126.4 385 128.4 395.3 134.4 403.4C140.4 411.5 150 416 160 416L314.2 416zM288 576C288 593.7 302.3 608 320 608C337.7 608 352 593.7 352 576L352 464L288 464L288 576z"/></svg>
        <span>Pin</span>
      </button>

      <button class="action--delete action-btn">
        <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"/></svg>
        <span>Delete</span>
      </button>

      <button class="action--save action-btn">
        <svg class="action-icon save" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM438 209.7C427.3 201.9 412.3 204.3 404.5 215L285.1 379.2L233 327.1C223.6 317.7 208.4 317.7 199.1 327.1C189.8 336.5 189.7 351.7 199.1 361L271.1 433C276.1 438 282.9 440.5 289.9 440C296.9 439.5 303.3 435.9 307.4 430.2L443.3 243.2C451.1 232.5 448.7 217.5 438 209.7z"/></svg>
        <span>Save Changes</span>
      </button>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
